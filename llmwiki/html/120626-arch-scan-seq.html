<script>
document.querySelectorAll('.diagram-box').forEach(box=>{const svg=box.querySelector('svg');if(!svg)return;
const m=[...svg.querySelectorAll('g.msg')],c=box.querySelector('.captext'),n=box.querySelector('.stepno');
let i=0,p=false,t=null;function tick(){if(p)return;if(i<m.length){m.forEach(x=>x.classList.remove('cur'));
m[i].classList.add('on','cur');c.textContent=m[i].dataset.cap;n.textContent=(i+1)+'/'+m.length;i++;t=setTimeout(tick,1900);}
else{t=setTimeout(()=>{if(p)return;m.forEach(x=>x.classList.remove('on','cur'));i=0;tick();},3000);}}
box.addEventListener('click',()=>{p=!p;if(p)clearTimeout(t);else tick();});setTimeout(tick,400);});
</script></body></html>
